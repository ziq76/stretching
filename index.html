<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Morning Primer | Protocol</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-black text-zinc-100 min-h-screen flex flex-col items-center p-4 selection:bg-zinc-800 selection:text-white">

  <main class="w-full max-w-md my-4 space-y-5">
    
    <!-- Top Bar -->
    <header class="border-b border-zinc-900 pb-3 flex justify-between items-baseline">
      <div>
        <h1 class="text-xs font-bold uppercase tracking-[0.25em] text-zinc-400">PROTOCOL</h1>
        <div class="text-xl font-extrabold tracking-tight text-white">MORNING PRIMER</div>
      </div>
      <div id="todayDate" class="mono text-xs text-zinc-500">2026-09-19</div>
    </header>

    <!-- Stoic Anchor Quote -->
    <div id="quoteBox" class="p-3.5 bg-zinc-950 border border-zinc-900 rounded-xl text-xs text-zinc-400 italic">
      "Disiplin bermula saat kau buka mata: takluki tubuh sebelum dunia mula menuntut."
    </div>

    <!-- Core Metrics -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-zinc-950 border border-zinc-900 rounded-2xl p-4">
        <span class="text-[10px] mono uppercase tracking-wider text-zinc-500 block">Consecutive Streak</span>
        <div class="flex items-baseline gap-1 mt-1">
          <span id="streakDays" class="text-4xl font-extrabold tracking-tight text-emerald-400 mono">0</span>
          <span class="text-xs text-zinc-500">HARI</span>
        </div>
      </div>
      <div class="bg-zinc-950 border border-zinc-900 rounded-2xl p-4">
        <span class="text-[10px] mono uppercase tracking-wider text-zinc-500 block">Total Primed</span>
        <div class="flex items-baseline gap-1 mt-1">
          <span id="totalPrimed" class="text-4xl font-extrabold tracking-tight text-zinc-200 mono">0</span>
          <span class="text-xs text-zinc-500">SESI</span>
        </div>
      </div>
    </div>

    <!-- Progress Discipline Bar -->
    <div class="bg-zinc-950 border border-zinc-900 rounded-2xl p-4 space-y-2">
      <div class="flex justify-between text-xs mono">
        <span class="text-zinc-500 uppercase tracking-wider">Phase Target (30 Hari)</span>
        <span id="progressPercent" class="text-emerald-400 font-bold">0%</span>
      </div>
      <div class="w-full h-2 bg-zinc-900 rounded-full overflow-hidden">
        <div id="progressBar" class="h-full bg-emerald-500 transition-all duration-700" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Action Section -->
    <section class="bg-zinc-950 border border-zinc-900 rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-center">
        <span class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Status Sesi Hari Ini:</span>
        <span id="statusIndicator" class="text-[10px] mono font-bold px-2 py-0.5 rounded bg-zinc-900 text-zinc-500 border border-zinc-800">UNRESOLVED</span>
      </div>

      <!-- Tab Switcher: Selesai vs Terlepas -->
      <div class="grid grid-cols-2 gap-1 p-1 bg-black border border-zinc-900 rounded-xl text-xs mono">
        <button id="tabDoneBtn" type="button" onclick="switchMode('done')" class="py-2 rounded-lg bg-zinc-900 text-white font-bold transition">Selesai</button>
        <button id="tabMissedBtn" type="button" onclick="switchMode('missed')" class="py-2 rounded-lg text-zinc-500 hover:text-zinc-300 transition">Terlepas / Skip</button>
      </div>

      <!-- Container Mod 1: Stretching Selesai -->
      <div id="doneModeContainer" class="space-y-4">
        <span class="text-[11px] uppercase tracking-wider mono text-zinc-500 block">Fokus Bahagian:</span>
        <div class="grid grid-cols-3 gap-2 text-xs mono">
          <button type="button" onclick="selectFocus(this, 'Spine & Back')" class="focus-btn p-2 rounded-lg border border-zinc-800 bg-black text-zinc-400 hover:text-white transition">Spine/Back</button>
          <button type="button" onclick="selectFocus(this, 'Hips & Legs')" class="focus-btn p-2 rounded-lg border border-zinc-800 bg-black text-zinc-400 hover:text-white transition">Hips/Legs</button>
          <button type="button" onclick="selectFocus(this, 'Full Mobility')" class="focus-btn p-2 rounded-lg border border-emerald-500 bg-zinc-900 text-emerald-400 transition">Full Body</button>
        </div>

        <input type="text" id="mentalNote" placeholder="Catatan fizikal ringkas (cth: hamstring ketat, dekompresi selesai)..."
          class="w-full bg-black border border-zinc-800 rounded-xl p-3 text-xs text-zinc-200 focus:outline-none focus:border-zinc-500 placeholder:text-zinc-700">

        <button id="commitBtn" onclick="commitEntry(true)"
          class="w-full py-4 bg-zinc-100 hover:bg-white active:scale-[0.98] transition font-extrabold text-black rounded-xl text-xs uppercase tracking-widest mono">
          Commit: Stretching Selesai
        </button>
      </div>

      <!-- Container Mod 2: Terlepas / Skip -->
      <div id="missedModeContainer" class="space-y-4 hidden">
        <span class="text-[11px] uppercase tracking-wider mono text-zinc-500 block">Pilih Sebab Terlepas:</span>
        <div class="grid grid-cols-2 gap-2 text-xs mono">
          <button type="button" onclick="selectMissedReason(this, 'Terlewat Bangun')" class="missed-reason-btn p-2.5 rounded-lg border border-rose-500 bg-zinc-900 text-rose-400 transition text-left">😴 Terlewat Bangun</button>
          <button type="button" onclick="selectMissedReason(this, 'Sakit / Kecederaan')" class="missed-reason-btn p-2.5 rounded-lg border border-zinc-800 bg-black text-zinc-400 hover:text-white transition text-left">🩹 Sakit / Cedera</button>
          <button type="button" onclick="selectMissedReason(this, 'Kekangan Masa / Urgent')" class="missed-reason-btn p-2.5 rounded-lg border border-zinc-800 bg-black text-zinc-400 hover:text-white transition text-left">⏳ Sangat Sibuk</button>
          <button type="button" onclick="selectMissedReason(this, 'Kurang Motivasi / Malas')" class="missed-reason-btn p-2.5 rounded-lg border border-zinc-800 bg-black text-zinc-400 hover:text-white transition text-left">🔋 Rendah Tenaga</button>
        </div>

        <input type="text" id="missedNote" placeholder="Catatan audit kendiri / faktor penghalang..."
          class="w-full bg-black border border-zinc-800 rounded-xl p-3 text-xs text-zinc-200 focus:outline-none focus:border-zinc-500 placeholder:text-zinc-700">

        <button id="commitMissedBtn" onclick="commitEntry(false)"
          class="w-full py-4 bg-rose-950/80 hover:bg-rose-900 border border-rose-800 active:scale-[0.98] transition font-extrabold text-rose-200 rounded-xl text-xs uppercase tracking-widest mono">
          Log Hari Terlepas (Reset Streak)
        </button>
      </div>
    </section>

    <!-- Execution Log History -->
    <section class="space-y-2">
      <div class="flex justify-between items-center text-xs uppercase tracking-wider mono text-zinc-500">
        <span>Execution History</span>
        <button onclick="loadTracker()" class="hover:text-zinc-300">Sync 🔄</button>
      </div>
      <div id="logsHistory" class="space-y-2 max-h-64 overflow-y-auto pr-1 text-xs mono">
        <p class="text-zinc-700 text-center py-4">Memuat rekod...</p>
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = "https://jrbbiqchqahyjhkxqmgr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_5NR1DcL0YZ1Z5416-kX_2w_f8la6ycO";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentMode = "done";
    let selectedFocus = "Full Mobility";
    let selectedReason = "Terlewat Bangun";

    function getTodayString() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    const todayStr = getTodayString();
    document.getElementById('todayDate').innerText = todayStr;

    function switchMode(mode) {
      currentMode = mode;
      const doneBox = document.getElementById('doneModeContainer');
      const missedBox = document.getElementById('missedModeContainer');
      const doneBtn = document.getElementById('tabDoneBtn');
      const missedBtn = document.getElementById('tabMissedBtn');

      if (mode === 'done') {
        doneBox.classList.remove('hidden');
        missedBox.classList.add('hidden');
        doneBtn.className = "py-2 rounded-lg bg-zinc-900 text-white font-bold transition";
        missedBtn.className = "py-2 rounded-lg text-zinc-500 hover:text-zinc-300 transition";
      } else {
        doneBox.classList.add('hidden');
        missedBox.classList.remove('hidden');
        missedBtn.className = "py-2 rounded-lg bg-rose-950/50 text-rose-300 border border-rose-900/50 font-bold transition";
        doneBtn.className = "py-2 rounded-lg text-zinc-500 hover:text-zinc-300 transition";
      }
    }

    function selectFocus(el, val) {
      document.querySelectorAll('.focus-btn').forEach(btn => {
        btn.classList.remove('border-emerald-500', 'text-emerald-400', 'bg-zinc-900');
        btn.classList.add('border-zinc-800', 'text-zinc-400', 'bg-black');
      });
      el.classList.add('border-emerald-500', 'text-emerald-400', 'bg-zinc-900');
      el.classList.remove('border-zinc-800', 'text-zinc-400', 'bg-black');
      selectedFocus = val;
    }

    function selectMissedReason(el, val) {
      document.querySelectorAll('.missed-reason-btn').forEach(btn => {
        btn.classList.remove('border-rose-500', 'text-rose-400', 'bg-zinc-900');
        btn.classList.add('border-zinc-800', 'text-zinc-400', 'bg-black');
      });
      el.classList.add('border-rose-500', 'text-rose-400', 'bg-zinc-900');
      el.classList.remove('border-zinc-800', 'text-zinc-400', 'bg-black');
      selectedReason = val;
    }

    async function loadTracker() {
      const { data, error } = await db
        .from('morning_stretching')
        .select('*')
        .order('stretch_date', { ascending: false });

      if (error) {
        console.error(error);
        return;
      }

      const logs = data || [];
      const totalPrimed = logs.filter(l => l.completed === true).length;
      document.getElementById('totalPrimed').innerText = totalPrimed;

      const todayLog = logs.find(l => l.stretch_date === todayStr);
      const commitBtn = document.getElementById('commitBtn');
      const commitMissedBtn = document.getElementById('commitMissedBtn');
      const statusInd = document.getElementById('statusIndicator');

      if (todayLog) {
        if (todayLog.completed) {
          statusInd.innerText = "COMPLETED";
          statusInd.className = "text-[10px] mono font-bold px-2 py-0.5 rounded bg-emerald-950/60 text-emerald-400 border border-emerald-800";
        } else {
          statusInd.innerText = "MISSED";
          statusInd.className = "text-[10px] mono font-bold px-2 py-0.5 rounded bg-rose-950/60 text-rose-400 border border-rose-800";
        }
        commitBtn.disabled = true;
        commitBtn.innerText = "Rekod Hari Ini Dikunci ✓";
        commitBtn.className = "w-full py-4 bg-zinc-900 text-zinc-600 rounded-xl text-xs uppercase tracking-widest mono cursor-not-allowed";
        
        commitMissedBtn.disabled = true;
        commitMissedBtn.innerText = "Hari Ini Dicatat Terlepas";
        commitMissedBtn.className = "w-full py-4 bg-zinc-900 text-zinc-600 rounded-xl text-xs uppercase tracking-widest mono cursor-not-allowed";
      } else {
        statusInd.innerText = "PENDING";
        statusInd.className = "text-[10px] mono font-bold px-2 py-0.5 rounded bg-amber-950/60 text-amber-400 border border-amber-800";
        
        commitBtn.disabled = false;
        commitBtn.innerText = "Commit: Stretching Selesai";
        commitBtn.className = "w-full py-4 bg-zinc-100 hover:bg-white active:scale-[0.98] transition font-extrabold text-black rounded-xl text-xs uppercase tracking-widest mono";

        commitMissedBtn.disabled = false;
        commitMissedBtn.innerText = "Log Hari Terlepas (Reset Streak)";
        commitMissedBtn.className = "w-full py-4 bg-rose-950/80 hover:bg-rose-900 border border-rose-800 active:scale-[0.98] transition font-extrabold text-rose-200 rounded-xl text-xs uppercase tracking-widest mono";
      }

      // Kira streak (hanya sesi completed === true dikira)
      let streak = 0;
      let curr = new Date();
      if (!todayLog || !todayLog.completed) {
        curr.setDate(curr.getDate() - 1);
      }

      while (true) {
        const yyyy = curr.getFullYear();
        const mm = String(curr.getMonth() + 1).padStart(2, '0');
        const dd = String(curr.getDate()).padStart(2, '0');
        const dStr = `${yyyy}-${mm}-${dd}`;

        const entry = logs.find(l => l.stretch_date === dStr);
        if (entry && entry.completed) {
          streak++;
          curr.setDate(curr.getDate() - 1);
        } else {
          break;
        }
      }

      document.getElementById('streakDays').innerText = streak;

      const phaseTarget = 30;
      const pct = Math.min(Math.round((streak / phaseTarget) * 100), 100);
      document.getElementById('progressPercent').innerText = `${pct}% (${streak}/${phaseTarget} HARI)`;
      document.getElementById('progressBar').style.width = `${pct}%`;

      // Log Sejarah
      const logsContainer = document.getElementById('logsHistory');
      if (logs.length === 0) {
        logsContainer.innerHTML = `<p class="text-zinc-700 text-center py-4">Tiada rekod stretching lagi.</p>`;
        return;
      }

      logsContainer.innerHTML = logs.map(l => {
        const isCompleted = l.completed !== false;
        return `
          <div class="flex justify-between items-center p-3 rounded-xl bg-zinc-950 border ${isCompleted ? 'border-zinc-900' : 'border-rose-950/60'}">
            <div>
              <div class="text-zinc-200 font-semibold">
                ${l.stretch_date} 
                <span class="text-[10px] ${isCompleted ? 'text-zinc-500' : 'text-rose-400'} ml-1">[${l.intensity_focus || 'Routine'}]</span>
              </div>
              <div class="text-[11px] text-zinc-500 mt-0.5">${l.mental_note || '-'}</div>
            </div>
            <span class="${isCompleted ? 'text-emerald-400 bg-emerald-950/40 border-emerald-900/60' : 'text-rose-400 bg-rose-950/40 border-rose-900/60'} border px-2 py-0.5 rounded text-[10px] font-bold">
              ${isCompleted ? 'DONE' : 'MISSED'}
            </span>
          </div>
        `;
      }).join('');
    }

    async function commitEntry(isDone) {
      const activeBtn = isDone ? document.getElementById('commitBtn') : document.getElementById('commitMissedBtn');
      activeBtn.disabled = true;
      activeBtn.innerText = "Recording...";

      const payload = {
        stretch_date: todayStr,
        completed: isDone,
        intensity_focus: isDone ? selectedFocus : `Missed: ${selectedReason}`,
        mental_note: isDone 
          ? (document.getElementById('mentalNote').value.trim() || 'Mobiliti pagi selesai.') 
          : (document.getElementById('missedNote').value.trim() || `Terlepas rutin: ${selectedReason}`)
      };

      const { error } = await db
        .from('morning_stretching')
        .upsert(payload, { onConflict: 'stretch_date' });

      if (error) {
        alert("Ralat simpan: " + error.message);
        activeBtn.disabled = false;
        activeBtn.innerText = isDone ? "Commit: Stretching Selesai" : "Log Hari Terlepas";
      } else {
        document.getElementById('mentalNote').value = "";
        document.getElementById('missedNote').value = "";
        await loadTracker();
      }
    }

    loadTracker();
  </script>
</body>
</html>
